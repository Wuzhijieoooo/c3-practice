<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="C3刷题">
  <meta name="description" content="安全员 C3 题库，十题一组，利用通勤时间轻松练习。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    /* Keep the shell still even before the stylesheet and question bank load. */
    html{height:100%;overflow:hidden;overscroll-behavior:none;background:#f6f7f2}
    body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
    #app{height:var(--viewport-height,100%);min-height:0;overflow:hidden}
  </style>
  <link rel="stylesheet" href="./style.css?v=12">
  <title>C3 通勤刷题</title>
</head>
<body>
  <main id="app"><div class="loading"><span class="brand-icon">C3</span><p>正在准备你的题库…</p></div></main>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="install-backdrop" hidden></div>
  <dialog id="install-dialog" role="dialog" aria-modal="true" aria-labelledby="install-title" tabindex="-1">
    <button class="close" aria-label="关闭安装说明">×</button>
    <span class="eyebrow">带上题库，随时出发</span>
    <h2 id="install-title">放到 iPhone 主屏幕</h2>
    <ol><li>在 Safari 中打开本站。</li><li>点击「分享」，选择「添加到主屏幕」。</li><li>首次打开时保持联网，直到页面显示「离线可用」。</li></ol>
    <p class="muted">请使用无需临时授权参数即可打开的正式地址。预览链接可能在从主屏幕启动时出现 401。</p>
    <p class="muted">进度保存在当前浏览器或主屏幕应用中。建议添加后一直从主屏幕进入；清除网站数据会删除进度。</p>
    <button class="primary close-dialog">知道了</button>
  </dialog>
  <script>
    function updateViewport() { document.documentElement.style.setProperty('--viewport-height', window.innerHeight + 'px'); }
    updateViewport();
    window.addEventListener('resize', updateViewport);
    // Safari 14 ignores overscroll-behavior: stop boundary drags, keeping inner scrolling and pinch zoom.
    let touchX = 0, touchY = 0;
    document.addEventListener('touchstart', event => {
      if (event.touches.length !== 1) return;
      touchX = event.touches[0].clientX; touchY = event.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchmove', event => {
      if (event.touches.length !== 1) return;
      const dx = event.touches[0].clientX - touchX, dy = event.touches[0].clientY - touchY;
      touchX = event.touches[0].clientX; touchY = event.touches[0].clientY;
      if (!dy || Math.abs(dx) > Math.abs(dy)) return;
      for (let el = event.target; el && el !== document.body; el = el.parentElement) {
        if (el.nodeType !== 1 || !/(auto|scroll)/.test(getComputedStyle(el).overflowY)) continue;
        const max = el.scrollHeight - el.clientHeight;
        if (max > 1 && (dy < 0 && el.scrollTop < max - 1 || dy > 0 && el.scrollTop > 1)) return;
      }
      if (event.cancelable) event.preventDefault();
    }, { passive: false });
    // Register independently of app.js so a failed module import cannot prevent updates.
    if ('serviceWorker' in navigator) {
      let controlled = Boolean(navigator.serviceWorker.controller);
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (controlled) location.reload();
        controlled = true;
      });
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(error => console.warn('离线缓存更新失败', error));
    }
  </script>
  <script type="module" src="./app.js?v=12"></script>
</body>
</html>
